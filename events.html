<body>
  <div class="kente-frame">
    <div class="kente-border kente-top"></div>
    <div class="kente-border kente-bottom"></div>
    <div class="kente-border kente-left"></div>
    <div class="kente-border kente-right"></div>
  </div>

  <div class="nav-overlay" id="nav-overlay" aria-hidden="true"></div>
  <nav class="nav">
    <a href="../" class="nav-logo">
      <img src="HGAY_ASSETS/logo.png" alt="How Ghanaian Are You">

    <div class="nav-links" id="nav-links">
      <a href="../">Home</a>
      <a href="../#about">About</a>

      <span></span><span></span><span></span>
    </button>
  </nav>

  <main class="ev-page">
    <header class="ev-hero">
      <p class="ev-eyebrow">Event calendar</p>
      <h1 class="ev-title">Events</h1>
      <p class="ev-lead">Game nights, pop-ups, and gatherings. Join us in person and celebrate Ghanaian culture.</p>
    </header>

    <section class="ev-tabs" role="tablist" aria-label="Event filter">
      <button type="button" class="ev-tab is-active" data-filter="upcoming" role="tab" aria-selected="true">Upcoming</button>
      <button type="button" class="ev-tab" data-filter="past" role="tab" aria-selected="false">Past</button>
      <button type="button" class="ev-tab" data-filter="all" role="tab" aria-selected="false">All</button>
    </section>

    <p class="ev-status" id="ev-status" aria-live="polite"></p>
    <div class="ev-calendar" id="ev-calendar" aria-live="polite"></div>
  </main>

  <footer class="footer">
    <div class="container">
      <img src="HGAY_ASSETS/logo.png" alt="" class="footer-logo">
      <p class="footer-tagline">Celebrating Ghanaian pride, one card at a time.</p>
