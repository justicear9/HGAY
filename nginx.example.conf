# If your live host uses Nginx (not Apache), .htaccess is ignored.
# Add something like this inside your server { } block (adjust root path).

location / {
    try_files $uri $uri/ @hgay;
}

location @hgay {
    rewrite ^$ /index.html last;
    rewrite ^gallery/?$ /gallery.html last;
    rewrite ^fact-check/?$ /fact-check.html last;
    rewrite ^events/?$ /events.html last;
    rewrite ^verify/?$ /verify.php last;
    rewrite ^create_order/?$ /create_order.php last;
    rewrite ^api/([a-z0-9_-]+)/?$ /api/$1.php last;
    rewrite ^admin/?$ /admin/index.php last;
    rewrite ^admin/([a-z0-9_-]+)/?$ /admin/$1.php last;
}
